# Render Blueprint: backend Spring Boot z backend/Dockerfile.
# Baza: Neon (osobno), adres wklejasz w panelu Rendera jako DATABASE_URL.
services:
  - type: web
    name: watchbrief-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
