server.port=${PORT:8080}
# Lokalna baza H2 w pliku backend/data/watchbrief.mv.db (zero instalacji, dziala bez internetu).
# Katalog z danymi mozna zmienic zmienna DATA_DIR, np. DATA_DIR=D:/watchbrief-data
spring.datasource.url=jdbc:h2:file:${DATA_DIR:./data}/watchbrief
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Siec lokalna statku: front moze byc otwierany z dowolnego adresu IP, wiec domyslnie wszystko dozwolone.
watchbrief.cors-origins=${CORS_ORIGINS:*}
server.address=${BIND_ADDRESS:0.0.0.0}
watchbrief.seed-on-empty=true
