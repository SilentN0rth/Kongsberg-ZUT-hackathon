server.port=${PORT:8080}
# Bez DATABASE_URL startuje na lokalnym H2 (plik) - zero konfiguracji do developmentu.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/watchbrief;MODE=PostgreSQL}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB
server.tomcat.max-http-form-post-size=12MB
watchbrief.cors-origins=${CORS_ORIGINS:http://localhost:3000}
watchbrief.seed-on-empty=true
