server.port=${PORT:8080}
# Bez DATABASE_URL: lokalna baza H2 w pliku backend/data/watchbrief.mv.db (zero instalacji, dziala bez internetu).
# Katalog z danymi mozna zmienic zmienna DATA_DIR, np. DATA_DIR=D:/watchbrief-data
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:${DATA_DIR:./data}/watchbrief;MODE=PostgreSQL}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB
server.tomcat.max-http-form-post-size=12MB
# Siec lokalna statku: front moze byc otwierany z dowolnego adresu IP, wiec domyslnie wszystko dozwolone.
watchbrief.cors-origins=${CORS_ORIGINS:*}
server.address=${BIND_ADDRESS:0.0.0.0}
watchbrief.seed-on-empty=true
